version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnscan-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./vulnscan.db
      - SAFE_MODE=true
      - SSRF_PROTECTION=true
      - ALLOW_LOCAL_TARGETS=true
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/vulnscan.db:/app/vulnscan.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnscan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

