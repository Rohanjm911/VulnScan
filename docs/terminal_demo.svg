<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" fill="none">
  <defs>
    <style>
      @keyframes typeLine1 { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 12% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 25% { opacity: 0; } 32% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine4 { 0%, 40% { opacity: 0; } 48% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine5 { 0%, 55% { opacity: 0; } 63% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine6 { 0%, 70% { opacity: 0; } 78% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine7 { 0%, 85% { opacity: 0; } 92% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scanSweep {
        0% { transform: translateY(-5px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      .line-1 { animation: typeLine1 10s infinite; }
      .line-2 { animation: typeLine2 10s infinite; }
      .line-3 { animation: typeLine3 10s infinite; }
      .line-4 { animation: typeLine4 10s infinite; }
      .line-5 { animation: typeLine5 10s infinite; }
      .line-6 { animation: typeLine6 10s infinite; }
      .line-7 { animation: typeLine7 10s infinite; }
      .cursor { animation: blinkCursor 0.8s infinite; }
      .scanline { animation: scanSweep 6s infinite linear; }
    </style>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="800" height="320" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="2"/>

  <!-- Scanning Sweep Beam -->
  <rect width="800" height="40" fill="url(#scanGrad)" class="scanline" pointer-events="none"/>

  <!-- Window Titlebar -->
  <rect width="800" height="40" rx="12" fill="#111827"/>
  <rect y="28" width="800" height="12" fill="#111827"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Action Buttons -->
  <circle cx="24" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="20" r="5.5" fill="#10b981"/>

  <!-- Title Text -->
  <text x="400" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">
    vulnscan-core — Live Assessment Telemetry
  </text>

  <!-- Terminal Output Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500">
    <!-- Line 1: Command Initiation -->
    <g class="line-1">
      <text x="24" y="75" fill="#3b82f6">$</text>
      <text x="40" y="75" fill="#f8fafc">vulnscan run --target https://example.com --mode full --safe</text>
    </g>

    <!-- Line 2: DNS & Network -->
    <g class="line-2">
      <text x="24" y="105" fill="#10b981">[+]</text>
      <text x="52" y="105" fill="#94a3b8">DNS Intelligence: Resolved </text>
      <text x="242" y="105" fill="#60a5fa">example.com (172.66.147.243)</text>
      <text x="500" y="105" fill="#64748b">• 7 records, 1 active subdomain</text>
    </g>

    <!-- Line 3: TCP Port Scan -->
    <g class="line-3">
      <text x="24" y="135" fill="#10b981">[+]</text>
      <text x="52" y="135" fill="#94a3b8">Service Discovery: TCP Ports </text>
      <text x="260" y="135" fill="#34d399">80/HTTP, 443/HTTPS OPEN</text>
      <text x="480" y="135" fill="#64748b">• Server: cloudflare</text>
    </g>

    <!-- Line 4: SSL/TLS -->
    <g class="line-4">
      <text x="24" y="165" fill="#10b981">[+]</text>
      <text x="52" y="165" fill="#94a3b8">Cryptographic Audit: TLS 1.3 Handshake OK </text>
      <text x="365" y="165" fill="#10b981">[CERTIFICATE VALID • 218 DAYS REMAINING]</text>
    </g>

    <!-- Line 5: Header Findings -->
    <g class="line-5">
      <text x="24" y="195" fill="#f59e0b">[!]</text>
      <text x="52" y="195" fill="#cbd5e1">HTTP Defense Headers: </text>
      <text x="215" y="195" fill="#fbbf24">Missing CSP, Strict HSTS, X-Frame-Options</text>
      <text x="560" y="195" fill="#f97316">[6 FINDINGS IDENTIFIED]</text>
    </g>

    <!-- Line 6: DAST Canary Verification -->
    <g class="line-6">
      <text x="24" y="225" fill="#10b981">[+]</text>
      <text x="52" y="225" fill="#94a3b8">Non-Destructive DAST Prober: Safe Canary Tokens Verified </text>
      <text x="495" y="225" fill="#34d399">[NO INJECTION DETECTED]</text>
    </g>

    <!-- Line 7: Completion & Report -->
    <g class="line-7">
      <text x="24" y="260" fill="#3b82f6">[★]</text>
      <text x="52" y="260" fill="#f8fafc">Scan Completed Successfully • Security Score: </text>
      <text x="390" y="260" fill="#38bdf8" font-weight="700">85 / 100</text>
      <text x="460" y="260" fill="#a78bfa">• ReportLab PDF Compiled (100%)</text>
    </g>

    <!-- Interactive Cursor -->
    <text x="24" y="292" fill="#3b82f6" class="cursor">_</text>
  </g>
</svg>
